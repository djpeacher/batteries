<!doctype html>
<!--
  THROWAWAY PROTOTYPE — Local promise look (design descent scaffold).
  Not product code. DELETE public/_proto-local-promise/ BEFORE SHIPPING.

  The harness: a full-viewport same-origin iframe on the real Shelf or battery
  page, design injection (each design's css + mount), and the remote control.
  Rounds do NOT edit this file — they write their five designs into designs.js
  (see the comment block at its top). State lives in memory only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THROWAWAY prototype — Local promise</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #18181b; }
  iframe { display: block; border: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<iframe id="page" title="Real page under design"></iframe>

<script src="designs.js"></script>
<script>
(() => {
  const designs = window.DESIGNS || [];
  const TEXT = "Runs entirely in your browser. Nothing you type or open leaves your device.";
  const TAG = "data-proto-lp";
  const BASE = "/batteries/";
  const PAGES = {
    shelf: { label: "Shelf", url: BASE, page: "shelf", battery: null },
    md: { label: "Markdown Preview", url: BASE + "markdown-preview/", page: "frame", battery: "markdown-preview" },
    diff: { label: "Text Diff", url: BASE + "text-diff/", page: "frame", battery: "text-diff" },
  };
  const state = {
    design: 0,
    page: "shelf",
    theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
  };
  const frame = document.getElementById("page");
  const doc = () => { try { return frame.contentDocument; } catch (e) { return null; } };

  // ---- injection -------------------------------------------------------------
  function clear(d) {
    d.querySelectorAll(`[${TAG}]`).forEach(n => n.remove());
  }
  function inject() {
    const d = doc();
    if (!d || !d.documentElement) return;
    clear(d);
    d.documentElement.dataset.theme = state.theme;
    // Harness-only: hide Astro's dev toolbar so it doesn't sit in the comparison.
    const hide = d.createElement("style");
    hide.setAttribute(TAG, "harness");
    hide.textContent = "astro-dev-toolbar { display: none !important; }";
    d.head.appendChild(hide);
    const des = designs[state.design];
    if (!des) return;
    const st = d.createElement("style");
    st.setAttribute(TAG, "css");
    st.textContent = des.css || "";
    d.head.appendChild(st);
    const p = PAGES[state.page];
    const ctx = {
      page: p.page, text: TEXT, theme: state.theme, battery: p.battery,
      mark: el => (el.setAttribute(TAG, ""), el),
    };
    try { des.mount && des.mount(d, ctx); } catch (e) { console.error(`[proto] ${des.name} mount failed`, e); }
  }

  function setTheme() {
    const d = doc();
    if (d && d.documentElement) d.documentElement.dataset.theme = state.theme;
  }

  // ---- keys: ←/→ here and inside the iframe -----------------------------------
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    // Arrow keys in a text box move the caret; leave them alone.
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
    if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
  }
  addEventListener("keydown", onKey);

  frame.addEventListener("load", () => {
    const d = doc();
    if (!d) return;
    // Clicking a link inside the page (say, a Shelf entry) changes the state too.
    const hit = Object.entries(PAGES).find(([, p]) => p.url === d.location.pathname);
    if (hit) state.page = hit[0];
    d.addEventListener("keydown", onKey);
    inject();
    remote.update();
  });

  function loadPage() { frame.src = PAGES[state.page].url; }

  function step(dir) {
    if (!designs.length) return;
    state.design = (state.design + dir + designs.length) % designs.length;
    inject();
    remote.update();
  }

  // ---------------------------------------------------------------------------
  // Remote control — floating, bottom-right, draggable. Shadow DOM so it looks
  // the same whatever is on screen.
  // ---------------------------------------------------------------------------
  const remote = (() => {
    const host = document.createElement("wf-remote");
    host.style.cssText = "all:initial; display:block; position:fixed; right:16px; bottom:16px; z-index:2147483647;";
    const root = host.attachShadow({ mode: "open" });
    const pageBtns = Object.entries(PAGES).map(([k, p]) => `<button data-set="page" data-val="${k}">${p.label}</button>`).join("");
    root.innerHTML = `
      <style>
        :host { all: initial; }
        .panel {
          width: 260px; box-sizing: border-box;
          font: 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          color: #f1f1f1; background: rgba(24, 24, 27, .94);
          border: 1px solid #3f3f46; border-radius: 10px;
          box-shadow: 0 8px 28px rgba(0,0,0,.35);
          user-select: none; -webkit-user-select: none;
        }
        .grip { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; cursor: grab; border-bottom: 1px solid #3f3f46; touch-action: none; }
        .grip:active { cursor: grabbing; }
        .mark { font-size: 9px; letter-spacing: .08em; font-weight: 700; color: #fbbf24; }
        .dots { color: #71717a; letter-spacing: 2px; }
        .body { padding: 10px; display: grid; gap: 7px; }
        .nav { display: grid; grid-template-columns: 32px 1fr 32px; gap: 6px; align-items: center; }
        .name { text-align: center; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pos { text-align: center; color: #a1a1aa; font-size: 11px; margin-top: -4px; }
        .lbl { color: #a1a1aa; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; margin: 2px 0 -3px; }
        .row { display: grid; grid-auto-flow: column; grid-auto-columns: auto; gap: 1px; background: #52525b; border: 1px solid #52525b; border-radius: 6px; overflow: hidden; }
        button { all: unset; box-sizing: border-box; text-align: center; cursor: pointer; padding: 6px 4px; color: #e4e4e7; background: #232326; font: inherit; white-space: nowrap; }
        .nav button { border: 1px solid #52525b; border-radius: 6px; font-size: 14px; padding: 4px 0; background: transparent; }
        button:hover { background: #3f3f46; }
        button[aria-pressed="true"] { background: #e4e4e7; color: #18181b; font-weight: 600; }
        .hint { color: #71717a; font-size: 10px; text-align: center; }
      </style>
      <div class="panel">
        <div class="grip" title="Drag to move"><span class="mark">THROWAWAY PROTOTYPE</span><span class="dots">⋮⋮</span></div>
        <div class="body">
          <div class="nav">
            <button data-act="prev" title="Previous design (←)">←</button>
            <div class="name"></div>
            <button data-act="next" title="Next design (→)">→</button>
          </div>
          <div class="pos"></div>
          <div class="lbl">Page</div>
          <div class="row">${pageBtns}</div>
          <div class="lbl">Theme</div>
          <div class="row">
            <button data-set="theme" data-val="light">Light</button>
            <button data-set="theme" data-val="dark">Dark</button>
          </div>
          <div class="hint">← / → switch design · page and theme are kept</div>
        </div>
      </div>`;
    document.body.appendChild(host);

    const $ = s => root.querySelector(s);
    root.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.act === "prev") step(-1);
      else if (b.dataset.act === "next") step(1);
      else if (b.dataset.set === "page") { if (state.page !== b.dataset.val) { state.page = b.dataset.val; loadPage(); } }
      else if (b.dataset.set === "theme") { state.theme = b.dataset.val; setTheme(); }
      remote.update();
    });

    const grip = $(".grip");
    grip.addEventListener("pointerdown", e => {
      const r = host.getBoundingClientRect();
      const dx = e.clientX - r.left, dy = e.clientY - r.top;
      grip.setPointerCapture(e.pointerId);
      const move = ev => {
        host.style.setProperty("left", Math.max(0, Math.min(innerWidth - r.width, ev.clientX - dx)) + "px");
        host.style.setProperty("top", Math.max(0, Math.min(innerHeight - r.height, ev.clientY - dy)) + "px");
        host.style.setProperty("right", "auto");
        host.style.setProperty("bottom", "auto");
      };
      const up = () => { grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); };
      grip.addEventListener("pointermove", move);
      grip.addEventListener("pointerup", up);
    });

    return {
      update() {
        const d = designs[state.design];
        $(".name").textContent = d ? d.name : "—";
        $(".pos").textContent = designs.length ? `${state.design + 1} of ${designs.length}` : "";
        root.querySelectorAll("[data-set]").forEach(b => b.setAttribute("aria-pressed", String(state[b.dataset.set] === b.dataset.val)));
      },
    };
  })();

  window.__lp = { state, inject }; // console poking only
  remote.update();
  loadPage();
})();
</script>
</body>
</html>
